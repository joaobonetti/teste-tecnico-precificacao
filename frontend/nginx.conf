# =====================================================================
# Nginx do FRONTEND
#   /       → arquivos estáticos (HTML, CSS, JS)
#   /api/   → repassado ao container do backend (PHP)
# Front e API ficam na MESMA origem (localhost:8080): sem CORS e o
# cookie de sessão do login funciona naturalmente.
# =====================================================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Não revela a versão do Nginx
    server_tokens off;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Este próprio arquivo está na pasta servida: bloqueia o acesso
    location = /nginx.conf {
        deny all;
        return 404;
    }

    # API → backend (nome do serviço no docker-compose)
    location /api/ {
        proxy_pass         http://backend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Páginas e arquivos estáticos
    location / {
        try_files $uri $uri/ =404;
    }
}